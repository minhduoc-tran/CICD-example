name: Next.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      # Nếu bạn có test (Jest/Vitest/Playwright), giữ lại.
      # Nếu chưa có test, có thể tạm comment.
      # - name: Test
      #   run: npm test --if-present

      - name: Build
        run: npm run build
